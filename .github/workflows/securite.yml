name: Sécurité (secrets + dépendances)

# Contrôles informatifs sur chaque PR et chaque lundi : une dépendance peut devenir vulnérable sans PR.
on:
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Détection de secrets (gitleaks)
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependances:
    name: Audit des dépendances d'exécution (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      # Informatif : proxy-addr (critique, GHSA-jqcg-44mw-7w3h) n'a pas de version corrigée publiée au 07/10/2026 ; il ne concerne
      # qu'un sous-réseau de confiance IPv4-mappé (le service n'écoute qu'en loopback derrière un seul proxy). qs (modéré) est plafonné par express 4.22.2.
      # Repasser en bloquant dès qu'une version corrigée existe.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
